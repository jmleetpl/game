<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="'Comic Sans MS','Courier New',monospace" shape-rendering="crispEdges">
<rect width="480" height="360" fill="#fff"/>

  <rect width="480" height="360" fill="#1a1a1a"/>
  <!-- giant face -->
  <circle cx="240" cy="180" r="120" fill="#ffe0c0" stroke="#fff" stroke-width="4"/>
  <!-- slicked hair -->
  <path d="M120 160 Q 150 100 240 100 Q 330 100 360 160 L 360 180 L 120 180 Z" fill="#5a3a1a"/>
  <!-- eyes wide intense -->
  <ellipse cx="200" cy="170" rx="14" ry="10" fill="#fff"/>
  <ellipse cx="280" cy="170" rx="14" ry="10" fill="#fff"/>
  <circle cx="200" cy="170" r="6" fill="#3aa"/>
  <circle cx="280" cy="170" r="6" fill="#3aa"/>
  <circle cx="200" cy="170" r="3" fill="#000"/>
  <circle cx="280" cy="170" r="3" fill="#000"/>
  <!-- eyebrows -->
  <line x1="184" y1="156" x2="218" y2="160" stroke="#000" stroke-width="3"/>
  <line x1="262" y1="160" x2="296" y2="156" stroke="#000" stroke-width="3"/>
  <!-- hockey-style mouth muzzle -->
  <rect x="180" y="200" width="120" height="60" fill="#a89a78" stroke="#000" stroke-width="4"/>
  <line x1="180" y1="200" x2="180" y2="260" stroke="#000" stroke-width="2"/><line x1="200" y1="200" x2="200" y2="260" stroke="#000" stroke-width="2"/><line x1="220" y1="200" x2="220" y2="260" stroke="#000" stroke-width="2"/><line x1="240" y1="200" x2="240" y2="260" stroke="#000" stroke-width="2"/><line x1="260" y1="200" x2="260" y2="260" stroke="#000" stroke-width="2"/><line x1="280" y1="200" x2="280" y2="260" stroke="#000" stroke-width="2"/>
  <line x1="180" y1="200" x2="300" y2="200" stroke="#000" stroke-width="2"/><line x1="180" y1="220" x2="300" y2="220" stroke="#000" stroke-width="2"/><line x1="180" y1="240" x2="300" y2="240" stroke="#000" stroke-width="2"/>
  <!-- straps -->
  <line x1="180" y1="220" x2="120" y2="220" stroke="#a89a78" stroke-width="6"/>
  <line x1="300" y1="220" x2="360" y2="220" stroke="#a89a78" stroke-width="6"/>
  <!-- prison bars in foreground -->
  <rect x="40" y="0" width="14" height="360" fill="#444" stroke="#000" stroke-width="2"/><rect x="140" y="0" width="14" height="360" fill="#444" stroke="#000" stroke-width="2"/><rect x="240" y="0" width="14" height="360" fill="#444" stroke="#000" stroke-width="2"/><rect x="340" y="0" width="14" height="360" fill="#444" stroke="#000" stroke-width="2"/><rect x="440" y="0" width="14" height="360" fill="#444" stroke="#000" stroke-width="2"/>
  <rect x="160" y="326" width="160" height="22" fill="#000" stroke="#fff" stroke-width="2"/>
   <text x="240" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">HELLO CLARICE</text>

<rect x="2" y="2" width="476" height="356" fill="none" stroke="#000" stroke-width="5"/>
</svg>