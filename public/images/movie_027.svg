<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="'Comic Sans MS','Courier New',monospace" shape-rendering="crispEdges">
<rect width="480" height="360" fill="#fff"/>

  <rect width="480" height="360" fill="#3a1a0a"/>
  <!-- floor -->
  <rect x="0" y="270" width="480" height="90" fill="#2a0a05"/>
  <!-- ceiling -->
  <rect x="0" y="0" width="480" height="80" fill="#1a0500"/>
  <!-- corridor walls (horizontal lines for perspective) -->
  
    <line x1="0" y1="100" x2="480" y2="100" stroke="#5a2a1a" stroke-width="1"/>
    <line x1="0" y1="260" x2="480" y2="260" stroke="#5a2a1a" stroke-width="1"/>
  
    <line x1="0" y1="130" x2="480" y2="130" stroke="#5a2a1a" stroke-width="1"/>
    <line x1="0" y1="230" x2="480" y2="230" stroke="#5a2a1a" stroke-width="1"/>
  
    <line x1="0" y1="160" x2="480" y2="160" stroke="#5a2a1a" stroke-width="1"/>
    <line x1="0" y1="200" x2="480" y2="200" stroke="#5a2a1a" stroke-width="1"/>
  
    <line x1="0" y1="190" x2="480" y2="190" stroke="#5a2a1a" stroke-width="1"/>
    <line x1="0" y1="170" x2="480" y2="170" stroke="#5a2a1a" stroke-width="1"/>
  
    <line x1="0" y1="220" x2="480" y2="220" stroke="#5a2a1a" stroke-width="1"/>
    <line x1="0" y1="140" x2="480" y2="140" stroke="#5a2a1a" stroke-width="1"/>
  
    <line x1="0" y1="250" x2="480" y2="250" stroke="#5a2a1a" stroke-width="1"/>
    <line x1="0" y1="110" x2="480" y2="110" stroke="#5a2a1a" stroke-width="1"/>
  
  <!-- main hero in profile facing right, hammer raised -->
  <g transform="translate(120 200)">
    <!-- spiky hair -->
    <path d="M-8 -20 L -2 -30 L 4 -22 L 10 -32 L 14 -22 L 20 -32 L 22 -20 Z" fill="#000"/>
    <!-- side-profile head -->
    <ellipse cx="6" cy="-8" rx="14" ry="16" fill="#ffe0c0" stroke="#000" stroke-width="3"/>
    <!-- nose -->
    <polygon points="20,-10 24,-6 20,-2" fill="#ffe0c0" stroke="#000" stroke-width="2"/>
    <!-- eye angry -->
    <line x1="12" y1="-12" x2="20" y2="-10" stroke="#000" stroke-width="2"/>
    <circle cx="16" cy="-10" r="2" fill="#000"/>
    <!-- mouth determined -->
    <line x1="16" y1="-2" x2="22" y2="0" stroke="#000" stroke-width="2"/>
    <!-- body -->
    <polygon points="-10,8 18,8 24,70 -16,70" fill="#5a3a3a" stroke="#000" stroke-width="3"/>
    <!-- legs walking -->
    <line x1="-6" y1="70" x2="-16" y2="120" stroke="#000" stroke-width="8"/>
    <line x1="14" y1="70" x2="24" y2="120" stroke="#000" stroke-width="8"/>
    <!-- arm raising hammer behind -->
    <line x1="-4" y1="20" x2="-30" y2="-10" stroke="#5a3a3a" stroke-width="6"/>
    <line x1="14" y1="20" x2="40" y2="-30" stroke="#ffe0c0" stroke-width="6"/>
    <!-- hammer -->
    <rect x="34" y="-50" width="14" height="22" fill="#888" stroke="#000" stroke-width="2"/>
    <line x1="40" y1="-30" x2="48" y2="-50" stroke="#5a3a1a" stroke-width="3"/>
  </g>
  <!-- 3 enemies in front to right -->
  <g transform="translate(260 210) scale(1)">
      <circle cx="0" cy="0" r="12" fill="#ffe0c0" stroke="#000" stroke-width="2"/>
      <line x1="-10" y1="-2" x2="-5" y2="-2" stroke="#000" stroke-width="2"/>
      <line x1="5" y1="-2" x2="10" y2="-2" stroke="#000" stroke-width="2"/>
      <ellipse cx="0" cy="6" rx="3" ry="2" fill="#000"/>
      <polygon points="-12,12 12,12 16,60 -16,60" fill="#3a2a3a" stroke="#000" stroke-width="2"/>
      <line x1="-12" y1="20" x2="-30" y2="40" stroke="#3a2a3a" stroke-width="6"/>
      <line x1="12" y1="20" x2="30" y2="40" stroke="#3a2a3a" stroke-width="6"/>
      <line x1="-8" y1="60" x2="-14" y2="100" stroke="#000" stroke-width="6"/>
      <line x1="8" y1="60" x2="14" y2="100" stroke="#000" stroke-width="6"/>
    </g><g transform="translate(330 218) scale(0.85)">
      <circle cx="0" cy="0" r="12" fill="#ffe0c0" stroke="#000" stroke-width="2"/>
      <line x1="-10" y1="-2" x2="-5" y2="-2" stroke="#000" stroke-width="2"/>
      <line x1="5" y1="-2" x2="10" y2="-2" stroke="#000" stroke-width="2"/>
      <ellipse cx="0" cy="6" rx="3" ry="2" fill="#000"/>
      <polygon points="-12,12 12,12 16,60 -16,60" fill="#3a2a3a" stroke="#000" stroke-width="2"/>
      <line x1="-12" y1="20" x2="-30" y2="40" stroke="#3a2a3a" stroke-width="6"/>
      <line x1="12" y1="20" x2="30" y2="40" stroke="#3a2a3a" stroke-width="6"/>
      <line x1="-8" y1="60" x2="-14" y2="100" stroke="#000" stroke-width="6"/>
      <line x1="8" y1="60" x2="14" y2="100" stroke="#000" stroke-width="6"/>
    </g><g transform="translate(400 226) scale(0.7)">
      <circle cx="0" cy="0" r="12" fill="#ffe0c0" stroke="#000" stroke-width="2"/>
      <line x1="-10" y1="-2" x2="-5" y2="-2" stroke="#000" stroke-width="2"/>
      <line x1="5" y1="-2" x2="10" y2="-2" stroke="#000" stroke-width="2"/>
      <ellipse cx="0" cy="6" rx="3" ry="2" fill="#000"/>
      <polygon points="-12,12 12,12 16,60 -16,60" fill="#3a2a3a" stroke="#000" stroke-width="2"/>
      <line x1="-12" y1="20" x2="-30" y2="40" stroke="#3a2a3a" stroke-width="6"/>
      <line x1="12" y1="20" x2="30" y2="40" stroke="#3a2a3a" stroke-width="6"/>
      <line x1="-8" y1="60" x2="-14" y2="100" stroke="#000" stroke-width="6"/>
      <line x1="8" y1="60" x2="14" y2="100" stroke="#000" stroke-width="6"/>
    </g>
  <rect x="120" y="14" width="240" height="22" fill="#000" stroke="#ff0" stroke-width="2"/>
   <text x="240" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#ff0">ONE TAKE. ALL HAMMER.</text>

<rect x="2" y="2" width="476" height="356" fill="none" stroke="#000" stroke-width="5"/>
</svg>