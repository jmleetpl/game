    <!-- black suit white shirt -->
    <polygon points="-18,4 18,4 24,90 -24,90" fill="#000"/>
    <polygon points="-6,4 6,4 4,30 -4,30" fill="#fff"/>
    <line x1="-1" y1="4" x2="1" y2="30" stroke="#000" stroke-width="2"/>
