<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="'Comic Sans MS','Courier New',monospace" shape-rendering="crispEdges">
<rect width="480" height="360" fill="#fff"/>

  <rect width="480" height="360" fill="#3a1a3a"/>
  <!-- stairs going up-right -->
  <polygon points="0,320 60,320 60,340 0,340" fill="#aa9a6a" stroke="#000" stroke-width="2"/>
            <polygon points="0,340 60,340 70,370 10,370" fill="#7a6a3a" stroke="#000" stroke-width="2"/><polygon points="50,290 110,290 110,310 50,310" fill="#aa9a6a" stroke="#000" stroke-width="2"/>
            <polygon points="50,310 110,310 120,340 60,340" fill="#7a6a3a" stroke="#000" stroke-width="2"/><polygon points="100,260 160,260 160,280 100,280" fill="#aa9a6a" stroke="#000" stroke-width="2"/>
            <polygon points="100,280 160,280 170,310 110,310" fill="#7a6a3a" stroke="#000" stroke-width="2"/><polygon points="150,230 210,230 210,250 150,250" fill="#aa9a6a" stroke="#000" stroke-width="2"/>
            <polygon points="150,250 210,250 220,280 160,280" fill="#7a6a3a" stroke="#000" stroke-width="2"/><polygon points="200,200 260,200 260,220 200,220" fill="#aa9a6a" stroke="#000" stroke-width="2"/>
            <polygon points="200,220 260,220 270,250 210,250" fill="#7a6a3a" stroke="#000" stroke-width="2"/><polygon points="250,170 310,170 310,190 250,190" fill="#aa9a6a" stroke="#000" stroke-width="2"/>
            <polygon points="250,190 310,190 320,220 260,220" fill="#7a6a3a" stroke="#000" stroke-width="2"/><polygon points="300,140 360,140 360,160 300,160" fill="#aa9a6a" stroke="#000" stroke-width="2"/>
            <polygon points="300,160 360,160 370,190 310,190" fill="#7a6a3a" stroke="#000" stroke-width="2"/><polygon points="350,110 410,110 410,130 350,130" fill="#aa9a6a" stroke="#000" stroke-width="2"/>
            <polygon points="350,130 410,130 420,160 360,160" fill="#7a6a3a" stroke="#000" stroke-width="2"/><polygon points="400,80 460,80 460,100 400,100" fill="#aa9a6a" stroke="#000" stroke-width="2"/>
            <polygon points="400,100 460,100 470,130 410,130" fill="#7a6a3a" stroke="#000" stroke-width="2"/>
  <!-- joker mid-dance -->
  <g transform="translate(220 200)">
    <!-- head -->
    <circle cx="0" cy="0" r="20" fill="#e8f8e8" stroke="#000" stroke-width="3"/>
    <!-- green hair -->
    <path d="M-18 -4 Q -16 -28 0 -22 Q 16 -28 18 -4 Q 8 -14 0 -14 Q -8 -14 -18 -4" fill="#0a0" stroke="#000" stroke-width="2"/>
    <!-- white face paint accent: eye triangles -->
    <polygon points="-10,-2 -4,-8 -2,2" fill="#fff" stroke="#000" stroke-width="1"/>
    <polygon points="10,-2 4,-8 2,2" fill="#fff" stroke="#000" stroke-width="1"/>
    <circle cx="-7" cy="-3" r="1.5" fill="#000"/>
    <circle cx="7" cy="-3" r="1.5" fill="#000"/>
    <!-- huge red smile -->
    <path d="M-14 8 Q 0 24 14 8" fill="#a00" stroke="#000" stroke-width="2"/>
    <path d="M-14 8 L -22 16" stroke="#a00" stroke-width="3"/>
    <path d="M14 8 L 22 16" stroke="#a00" stroke-width="3"/>
    <!-- yellow vest + red suit -->
    <polygon points="-22,18 22,18 30,80 -30,80" fill="#a00" stroke="#000" stroke-width="3"/>
    <polygon points="-12,18 12,18 6,60 -6,60" fill="#ffd24a" stroke="#000" stroke-width="2"/>
    <!-- arms extended in dance pose -->
    <line x1="-22" y1="22" x2="-60" y2="-10" stroke="#a00" stroke-width="8"/>
    <line x1="22" y1="22" x2="60" y2="40" stroke="#a00" stroke-width="8"/>
    <!-- legs: one back, one bent forward (kicking) -->
    <line x1="-12" y1="80" x2="-30" y2="120" stroke="#a00" stroke-width="10"/>
    <line x1="12" y1="80" x2="40" y2="60" stroke="#a00" stroke-width="10"/>
    <!-- shoes -->
    <ellipse cx="-32" cy="124" rx="12" ry="4" fill="#000"/>
    <ellipse cx="44" cy="58" rx="10" ry="4" fill="#000"/>
  </g>
  <rect x="80" y="326" width="320" height="22" fill="#fff" stroke="#000" stroke-width="2"/>
   <text x="240" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">STAIR DANCE = SAD CLOWN</text>

<rect x="2" y="2" width="476" height="356" fill="none" stroke="#000" stroke-width="5"/>
</svg>